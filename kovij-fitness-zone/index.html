  <script type="application/ld+json">

      "telephone": "+91 90570 27053",
      "address": {
        "@type": "PostalAddress",

        "addressLocality": "Kota",
        "addressRegion": "Rajasthan",
        "postalCode": "324004",
        "addressCountry": "IN"
      },
      "sameAs": ["https://www.instagram.com/kovij_fitness_zone"]
    }
  </script>
  <title>Kovij Fitness Zone</title>
  <!-- Google Analytics. Initialised from a file (not inline) so the Content Security Policy can forbid inline scripts. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ECVV4MJVCN"></script>
  <script src="/gtag-init.js"></script>
